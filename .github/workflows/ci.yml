name: CI

# 릴리스 워크플로는 태그 푸시에서만 돈다. PR 단계에서 같은 검증을 먼저 돌려
# 린트·타입 오류나 깨진 테스트가 main에 들어가지 않게 한다.
on:
  pull_request:
  push:
    branches:
      - main

# 같은 브랜치에 연속 푸시하면 앞 실행을 취소한다. 마지막 커밋 결과만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # npm run build = tsc -noEmit && esbuild. 타입 검사가 여기 들어 있다.
      - run: npm run build
