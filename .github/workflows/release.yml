name: Release

# manifest.json의 version과 같은 태그(예: 1.0.0)를 푸시하면 릴리스 초안에 빌드 산출물을 첨부한다.
on:
  push:
    tags: ["*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: 태그와 manifest 버전 일치 확인
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      # Obsidian 공식 릴리스 가이드대로 산출물의 빌드 출처 증명을 만든다.
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            main.js
            manifest.json
            styles.css
